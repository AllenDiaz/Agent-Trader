[project]
name = "trader-apps"
version = "0.1.0"
description = "AI trading floor: FastAPI backend, MCP servers, Gradio dashboard, and a Vite frontend."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Agents / LLM providers
    "openai>=1.40",
    "openai-agents>=0.1",
    # Model Context Protocol servers/clients
    "mcp>=1.0",
    # Market data (Massive, formerly Polygon.io); falls back to the simulator
    "massive>=2.8",
    # Dashboard (demo/ + app.py)
    "gradio>=6.0",
    "pandas>=2.2",
    "plotly>=5.22",
    # Misc
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
